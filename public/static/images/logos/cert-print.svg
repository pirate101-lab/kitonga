<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="22" y="22" width="212" height="212" rx="40" fill="url(#cBg)"/>
  <!-- Certificate Card Document -->
  <rect x="50" y="46" width="156" height="156" rx="12" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.3))"/>
  <!-- Ornate Double Security Border -->
  <rect x="56" y="52" width="144" height="144" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <rect x="62" y="58" width="132" height="132" rx="6" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Header Crest / Emblem -->
  <polygon points="128,70 138,80 134,92 122,92 118,80" fill="url(#goldGrad)"/>
  <!-- Typography Lines (Names & Honor) -->
  <rect x="86" y="102" width="84" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="76" y="116" width="104" height="4" rx="2" fill="#64748b"/>
  <rect x="92" y="126" width="72" height="4" rx="2" fill="#64748b"/>
  <!-- Gold Embossed Wax Seal with Ribbon -->
  <polygon points="156,152 144,188 156,182 168,188" fill="#e11d48"/>
  <polygon points="172,152 162,188 174,182 186,188" fill="#be123c"/>
  <circle cx="164" cy="154" r="20" fill="url(#goldGrad)"/>
  <circle cx="164" cy="154" r="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 2"/>
  <polygon points="164,142 168,150 176,151 170,157 172,165 164,161 156,165 158,157 152,151 160,150" fill="#ffffff"/>
</svg>