<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="prtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Rounded Badge -->
  <rect x="20" y="20" width="216" height="216" rx="42" fill="url(#prtBg)"/>
  <rect x="24" y="24" width="208" height="208" rx="38" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.25"/>
  <!-- Paper / Substrate Sheet feeding through press -->
  <path d="M68 46 L188 46 L188 174 L68 174 Z" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
  <!-- Printed graphic lines on paper -->
  <rect x="84" y="60" width="88" height="8" rx="4" fill="#0284c7"/>
  <rect x="84" y="74" width="56" height="6" rx="3" fill="#e11d48"/>
  <rect x="84" y="86" width="72" height="6" rx="3" fill="#eab308"/>
  <!-- Precision Registration Marks (Crosshairs) -->
  <circle cx="172" cy="78" r="8" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="160" y1="78" x2="184" y2="78" stroke="#0f172a" stroke-width="2"/>
  <line x1="172" y1="66" x2="172" y2="90" stroke="#0f172a" stroke-width="2"/>
  <!-- Main Industrial Printing Press Cylinder / Heavy Roller -->
  <rect x="44" y="114" width="168" height="44" rx="16" fill="url(#rollerGrad)"/>
  <ellipse cx="52" cy="136" rx="8" ry="22" fill="#475569"/>
  <ellipse cx="204" cy="136" rx="8" ry="22" fill="#94a3b8"/>
  <rect x="60" y="128" width="136" height="16" rx="6" fill="#334155" opacity="0.6"/>
  <!-- Machine Chassis / Bearings -->
  <rect x="36" y="124" width="14" height="24" rx="4" fill="#1e293b"/>
  <rect x="206" y="124" width="14" height="24" rx="4" fill="#1e293b"/>
  <!-- CMYK Process Inks Bar -->
  <g transform="translate(56, 178)">
    <circle cx="18" cy="16" r="12" fill="#00ffff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="54" cy="16" r="12" fill="#ff007f" stroke="#ffffff" stroke-width="2"/>
    <circle cx="90" cy="16" r="12" fill="#ffea00" stroke="#ffffff" stroke-width="2"/>
    <circle cx="126" cy="16" r="12" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>